# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: pinstack.docs.buildwithfern.com
    edit-this-page:
      github:
        owner: fern-starter
        repo: matheesha-8nwdgl4i
        branch: main
      launch: dashboard
title: PinStack | Documentation
layout:
  searchbar-placement: header
  page-width: full
navigation:
  - api: PinStack API
    flattened: false
    layout:
      - Github:
          summary: docs/pages/github-overview.mdx
colors:
  accent-primary:
    light: "#006fff"
    dark: "#2988f7"
  background:
    light: "#FFFFFF"
    dark: "#010409"
  border:
    light: "#E5E7EB"
    dark: "#3d444d"
  header-background:
    dark: "#010409"
  card-background:
    dark: "#0d1117"
  sidebar-background:
    dark: "#0d1117"
theme:
  page-actions: toolbar
  footer-nav: minimal
  tabs: bubble
favicon: docs/assets/favicon.svg
css:
  - styles.css
  - docs/assets/onboarding-theme.css
js: custom.js
typography:
  headingsFont:
    name: Inter
  bodyFont:
    name: Inter
ai-search: {}
