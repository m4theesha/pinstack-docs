# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: pinstack.docs.buildwithfern.com
    edit-this-page:
      github:
        owner: fern-starter
        repo: matheesha-8nwdgl4i
        branch: main
      launch: dashboard
title: PinStack | Documentation
layout:
  searchbar-placement: header
  page-width: full
navigation:
  - api: PinStack API
    flattened: false
    layout:
      - Github:
          summary: docs/pages/github-overview.mdx
colors:
  accent-primary:
    light: "#008700"
    dark: "#4ADE80"
  background:
    light: "#FFFFFF"
    dark: "#111113"
  border:
    light: "#E5E7EB"
    dark: "#222325"
theme:
  page-actions: toolbar
  footer-nav: minimal
  tabs: bubble
logo:
  dark: docs/assets/logo-dark.svg
  light: docs/assets/logo.svg
  height: 20
  href: https://buildwithfern.com
favicon: docs/assets/favicon.svg
css:
  - styles.css
  - docs/assets/onboarding-theme.css
js: custom.js
typography:
  headingsFont:
    name: Inter
  bodyFont:
    name: Inter
ai-search: {}
